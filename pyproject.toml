[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "almasix-settings"
version = "0.1.0"
description = "Typed application settings for Almasix (almasix.settings)"
requires-python = ">=3.11"
dependencies = [
    "almasix>=0.9.0",
]
readme = "README.md"
license = "MIT"
authors = [{ name = "Almasix Contributors" }]

[project.optional-dependencies]
redis = [
    "redis>=5.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0",
    "ruff==0.16.6",
    "almasix-settings[redis]",
]

[project.entry-points."almasix.providers"]
settings = "almasix.settings.provider:SettingsServiceProvider"

[project.urls]
Homepage = "https://github.com/almasix-dev/almasix-settings"
Repository = "https://github.com/almasix-dev/almasix-settings"
Documentation = "https://github.com/almasix-dev/almasix-settings#readme"
Issues = "https://github.com/almasix-dev/almasix-settings/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/almasix"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/almasix",
    "/tests",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]

[tool.coverage.run]
branch = true
source = ["almasix.settings"]
omit = [
    "*/almasix/settings/database/migrations/**",
    "*/almasix/settings/console/**",
    "*/almasix/settings/provider.py",
    "*/almasix/settings/config/**",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
    "@overload",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
